name: Build standalone HTML

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:standalone
      - uses: actions/upload-artifact@v4
        with:
          name: kids-kanban-html
          path: dist/kids-kanban.html
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kids-kanban-html
      - name: Publish the release with the HTML file
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if assets=$(gh release view --repo "$REPOSITORY" --json assets --jq '.assets[].name' -- "$RELEASE_TAG"); then
            if ! grep -Fxq kids-kanban.html <<< "$assets"; then
              gh release upload --repo "$REPOSITORY" -- "$RELEASE_TAG" kids-kanban.html
            fi
          else
            gh release create --repo "$REPOSITORY" --verify-tag --generate-notes --latest --title "Kids Kanban $RELEASE_TAG" -- "$RELEASE_TAG" kids-kanban.html
          fi
